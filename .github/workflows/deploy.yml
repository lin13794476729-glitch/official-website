name: Deploy website

on:
  push:
    branches:
      - main
  workflow_dispatch:

concurrency:
  group: deploy-website
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Prepare SSH key
        run: |
          mkdir -p ~/.ssh
          printf '%s\n' "${{ secrets.LIGHTHOUSE_SSH_KEY }}" > ~/.ssh/lighthouse_deploy_key
          chmod 600 ~/.ssh/lighthouse_deploy_key
          ssh-keyscan -H "${{ secrets.LIGHTHOUSE_HOST }}" >> ~/.ssh/known_hosts

      - name: Backup current website
        run: |
          ssh -n -T -i ~/.ssh/lighthouse_deploy_key \
            "${{ secrets.LIGHTHOUSE_USER }}@${{ secrets.LIGHTHOUSE_HOST }}" \
            'set -e
             TS=$(date +%Y%m%d_%H%M%S)
             mkdir -p /home/www/backups
             if [ -d /home/www/htdocs ]; then
               cp -a --no-preserve=ownership /home/www/htdocs /home/www/backups/htdocs_$TS
             fi'

      - name: Upload website
        run: |
          REMOTE_PACKAGE="/tmp/official-website-${{ github.run_id }}.tar.gz"
          ssh -n -T -i ~/.ssh/lighthouse_deploy_key \
            "${{ secrets.LIGHTHOUSE_USER }}@${{ secrets.LIGHTHOUSE_HOST }}" \
            "set -e
             rm -f '$REMOTE_PACKAGE'
             TMP_DIR=\$(mktemp -d)
             curl -fsSL 'https://codeload.github.com/${{ github.repository }}/tar.gz/${{ github.sha }}' -o '$REMOTE_PACKAGE'
             tar -xzf '$REMOTE_PACKAGE' -C \"\$TMP_DIR\"
             SRC_DIR=\$(find \"\$TMP_DIR\" -mindepth 1 -maxdepth 1 -type d | head -n 1)
             for ITEM in .htaccess index.html index.php robots.txt sitemap.xml styles.css script.js assets; do
               if [ -e \"\$SRC_DIR/\$ITEM\" ]; then
                 cp -R \"\$SRC_DIR/\$ITEM\" /home/www/htdocs/
               fi
             done
             find /home/www/htdocs -type d -exec chmod g+rwX {} \\;
             rm -rf \"\$TMP_DIR\" '$REMOTE_PACKAGE'"

      - name: Health check
        run: |
          ssh -n -T -i ~/.ssh/lighthouse_deploy_key \
            "${{ secrets.LIGHTHOUSE_USER }}@${{ secrets.LIGHTHOUSE_HOST }}" \
            'curl -I http://127.0.0.1/ || true'
