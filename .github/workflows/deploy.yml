name: Deploy website

on:
  push:
    branches:
      - main
  workflow_dispatch:

concurrency:
  group: deploy-website
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Prepare SSH key
        run: |
          mkdir -p ~/.ssh
          printf '%s\n' "${{ secrets.LIGHTHOUSE_SSH_KEY }}" > ~/.ssh/lighthouse_deploy_key
          chmod 600 ~/.ssh/lighthouse_deploy_key
          ssh-keyscan -H "${{ secrets.LIGHTHOUSE_HOST }}" >> ~/.ssh/known_hosts

      - name: Prepare release files
        run: |
          mkdir -p release
          rsync -a \
            --include='/.htaccess' \
            --include='/index.html' \
            --include='/index.php' \
            --include='/styles.css' \
            --include='/script.js' \
            --include='/assets/***' \
            --exclude='*' \
            ./ release/

      - name: Backup current website
        run: |
          ssh -n -T -i ~/.ssh/lighthouse_deploy_key \
            "${{ secrets.LIGHTHOUSE_USER }}@${{ secrets.LIGHTHOUSE_HOST }}" \
            'set -e
             TS=$(date +%Y%m%d_%H%M%S)
             mkdir -p /home/www/backups
             if [ -d /home/www/htdocs ]; then
               cp -a --no-preserve=ownership /home/www/htdocs /home/www/backups/htdocs_$TS
             fi'

      - name: Upload website
        run: |
          tar -czf release.tar.gz -C release .
          base64 -w 0 release.tar.gz > release.tar.gz.b64
          split -b 60000 release.tar.gz.b64 release-part-
          REMOTE_B64="/tmp/official-website-${{ github.run_id }}.tar.gz.b64"
          REMOTE_PACKAGE="/tmp/official-website-${{ github.run_id }}.tar.gz"
          ssh -n -T -i ~/.ssh/lighthouse_deploy_key \
            "${{ secrets.LIGHTHOUSE_USER }}@${{ secrets.LIGHTHOUSE_HOST }}" \
            "rm -f '$REMOTE_B64' '$REMOTE_PACKAGE'"
          for PART in release-part-*; do
            CHUNK="$(cat "$PART")"
            ssh -n -T -i ~/.ssh/lighthouse_deploy_key \
              "${{ secrets.LIGHTHOUSE_USER }}@${{ secrets.LIGHTHOUSE_HOST }}" \
              "printf '%s' '$CHUNK' >> '$REMOTE_B64'"
          done
          ssh -n -T -i ~/.ssh/lighthouse_deploy_key \
            "${{ secrets.LIGHTHOUSE_USER }}@${{ secrets.LIGHTHOUSE_HOST }}" \
            "set -e
             TMP_DIR=\$(mktemp -d)
             base64 -d '$REMOTE_B64' > '$REMOTE_PACKAGE'
             tar -xzf '$REMOTE_PACKAGE' -C \"\$TMP_DIR\"
             cp -R \"\$TMP_DIR\"/. /home/www/htdocs/
             find /home/www/htdocs -type d -exec chmod g+rwX {} \\;
             rm -rf \"\$TMP_DIR\" '$REMOTE_B64' '$REMOTE_PACKAGE'"

      - name: Health check
        run: |
          ssh -n -T -i ~/.ssh/lighthouse_deploy_key \
            "${{ secrets.LIGHTHOUSE_USER }}@${{ secrets.LIGHTHOUSE_HOST }}" \
            'curl -I http://127.0.0.1/ || true'
